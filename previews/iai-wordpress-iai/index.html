<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WordPress Web IAI — The Golden Crumb</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --border: rgba(255,255,255,0.1);
      --text: #e8eef7;
      --muted: #9aa8bc;
      --accent: #7eb8ff;
      --code-bg: #0d1117;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem 1rem;
      flex-shrink: 0;
    }
    header h1 {
      font-size: 1rem;
      font-weight: 600;
      margin: 0;
      flex: 1;
      min-width: 12rem;
    }
    .tabs { display: flex; gap: 0.35rem; }
    .tabs button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      cursor: pointer;
      font: inherit;
      font-size: 0.85rem;
    }
    .tabs button.active {
      background: var(--accent);
      color: #0f1419;
      border-color: var(--accent);
      font-weight: 600;
    }
    .panel {
      flex: 1;
      min-height: 0;
      display: none;
      flex-direction: column;
    }
    .panel.active { display: flex; }
    #panel-preview iframe {
      flex: 1;
      width: 100%;
      border: 0;
      background: #fff;
    }
    #panel-code {
      padding: 0.75rem 1rem 1rem;
      gap: 0.5rem;
    }
    .code-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }
    .code-toolbar select {
      flex: 1;
      min-width: 12rem;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.45rem 0.6rem;
      font: inherit;
    }
    .code-toolbar a {
      color: var(--accent);
      font-size: 0.8rem;
      text-decoration: none;
    }
    pre {
      flex: 1;
      margin: 0;
      overflow: auto;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      font-size: 0.72rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .meta {
      font-size: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <h1>WordPress Web IAI — The Golden Crumb</h1>
    <div class="tabs" role="tablist">
      <button type="button" class="active" data-tab="preview" role="tab" aria-selected="true">Vista previa</button>
      <button type="button" data-tab="code" role="tab" aria-selected="false">Código</button>
    </div>
  </header>

  <section id="panel-preview" class="panel active" role="tabpanel">
    <iframe id="preview-frame" title="The Golden Crumb preview" src="preview/home.html"></iframe>
  </section>

  <section id="panel-code" class="panel" role="tabpanel" hidden>
    <div class="code-toolbar">
      <select id="file-select" aria-label="Archivo de código"></select>
      <a id="wp-link" href="https://miguelalejandrochavez-zcrxp.wordpress.com/" target="_blank" rel="noopener">Sitio en WordPress.com ↗</a>
    </div>
    <p class="meta" id="file-meta"></p>
    <pre id="code-view"><code>Loading…</code></pre>
  </section>

  <script>
    const files = [
      { path: 'code/home.blocks.html', label: 'Home — bloques Gutenberg', page: 'home' },
      { path: 'code/about.blocks.html', label: 'About — HTML exportado' },
      { path: 'code/contact.blocks.html', label: 'Contact — bloques Gutenberg' },
      { path: 'code/wp-nav.txt', label: 'Navegación superior' },
      { path: 'code/wp-footer-nav.txt', label: 'Navegación inferior' },
      { path: 'backup/home.json', label: 'Backup JSON — Home' },
      { path: 'backup/about.json', label: 'Backup JSON — About' },
      { path: 'backup/contact.json', label: 'Backup JSON — Contact' },
    ];

    const tabs = document.querySelectorAll('.tabs button');
    const panels = { preview: document.getElementById('panel-preview'), code: document.getElementById('panel-code') };
    const select = document.getElementById('file-select');
    const pre = document.getElementById('code-view');
    const meta = document.getElementById('file-meta');
    const frame = document.getElementById('preview-frame');

    files.forEach((f, i) => {
      const opt = document.createElement('option');
      opt.value = f.path;
      opt.textContent = f.label;
      if (i === 0) opt.selected = true;
      select.appendChild(opt);
    });

    async function loadCode(path) {
      pre.textContent = 'Cargando…';
      try {
        const res = await fetch(path);
        const text = await res.text();
        pre.textContent = text;
        meta.textContent = path + ' · ' + text.length.toLocaleString() + ' caracteres';
      } catch (e) {
        pre.textContent = 'No se pudo cargar: ' + path;
        meta.textContent = '';
      }
    }

    select.addEventListener('change', () => {
      loadCode(select.value);
      const f = files.find((x) => x.path === select.value);
      if (f && f.page) {
        frame.src = 'preview/' + f.page + '.html';
      }
    });

    tabs.forEach((btn) => {
      btn.addEventListener('click', () => {
        tabs.forEach((b) => {
          b.classList.toggle('active', b === btn);
          b.setAttribute('aria-selected', b === btn ? 'true' : 'false');
        });
        Object.entries(panels).forEach(([key, el]) => {
          const on = btn.dataset.tab === key;
          el.classList.toggle('active', on);
          el.hidden = !on;
        });
      });
    });

    loadCode(select.value);
  </script>
</body>
</html>
